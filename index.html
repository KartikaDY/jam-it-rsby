<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAM IT RSBY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Dioptimalkan untuk Acer P166HQL (15,6" 1366 x 768): semua ukuran mengikuti tinggi layar, jadi muat tanpa scroll. */
  :root{--bg1:#090d16;--ink:#efeaff;--soft:#b8b2d4;--ac:#c9bcff;--ac2:#a396e0;--clock:#f6f2ff;--date:#ddd6f3;--glow:rgba(150,125,255,.38);--tint:rgba(140,110,255,.10);--card:rgba(11,13,18,.58);--line:rgba(201,188,255,.26);--warn:#ff5c5f}
  *{box-sizing:border-box;margin:0}
  html{font-size:clamp(12px,2.1vh,20px)}
  html,body{min-height:100%}
  body{
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--bg1);
    min-height:100vh;padding:2.4vh clamp(16px,4vw,56px);
    display:flex;justify-content:center;align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  #bg{position:fixed;inset:0;z-index:-1;background:#090d16;overflow:hidden}
  .bglayer{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease}
  .bglayer.on{opacity:1}
  /* lapisan gelap tipis agar teks tetap terbaca, tapi gambar masih jelas terlihat */
  #bg::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(55% 42% at 50% 38%,var(--tint),transparent 72%),
      radial-gradient(120% 95% at 50% 50%,rgba(4,8,18,.10),rgba(4,8,18,.68)),
      rgba(6,10,20,.30)}
  main{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:2.6vh}

  h1{text-align:center;font-weight:600;font-size:3rem;line-height:1.15;letter-spacing:.12em;color:var(--ac);text-shadow:0 2px 22px rgba(0,0,0,.7),0 0 40px var(--glow)}
  .cursor{display:inline-block;width:.5em;height:.95em;margin-left:.35em;vertical-align:-.1em;background:var(--ac);animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .clock{display:flex;justify-content:center;align-items:baseline;
    font-weight:600;font-size:min(34vh,18.5vw);line-height:.95;letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;color:var(--clock);text-shadow:0 2px 30px rgba(0,0,0,.55),0 0 80px var(--glow)}
  .clock .c{color:var(--ac);opacity:.55;margin:0 .03em;position:relative;top:-.05em}
  .clock .s{color:var(--ac)}
  .date{text-shadow:0 2px 4px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.75);text-align:center;font-weight:600;font-size:1.5rem;letter-spacing:.06em;color:var(--clock);margin-top:-1vh}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:2vh clamp(12px,1.6vw,22px)}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .panel{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:background .5s,border-color .5s}
  .panel header{display:flex;justify-content:space-between;align-items:center;padding:.4rem 1.1rem;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.68rem;color:var(--ac2)}
  .panel header span:last-child{display:flex;align-items:center;gap:.5rem}
  .panel header i{width:.45rem;height:.45rem;border-radius:50%;background:var(--ac)}
  .body{padding:.8rem 1.2rem .9rem}

  .lbl{color:var(--soft);font-size:.8rem;margin-bottom:.3rem}
  .cd{font-size:2.15rem;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--clock);transition:color .5s}
  .bar{height:.32rem;margin-top:.65rem;background:var(--line);-webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 10px)}
  .bar b{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear,background .5s}
  .hint{margin-top:.5rem;color:var(--soft);font-size:.74rem;line-height:1.4}

  /* 2 menit terakhir sebelum jam pulang */
  #cdCard.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
  #cdCard.warn header{color:var(--warn)}
  #cdCard.warn header i{background:var(--warn);animation:blink .8s steps(1) infinite}
  #cdCard.warn .cd,#cdCard.warn .lbl,#cdCard.warn .hint{color:var(--warn)}
  #cdCard.warn .bar b{background:var(--warn)}

  .w-main{display:flex;align-items:center;gap:.8rem}
  .w-ico{font-size:2rem;line-height:1}
  .w-temp{font-size:2.15rem;font-weight:300;line-height:1;letter-spacing:-.02em;color:var(--clock)}
  .w-desc{margin-top:.2rem;font-size:.8rem;color:var(--soft)}
  .w-list{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:.5rem .8rem;margin-top:.7rem;font-size:.66rem;color:var(--soft)}
  @media(max-width:560px){.w-list{grid-template-columns:repeat(2,auto)}}
  .w-list b{display:block;margin-top:.1rem;color:var(--ink);font-size:.82rem;font-weight:400}
  .next{display:flex;gap:.6rem;margin-top:.6rem;padding-top:.55rem;border-top:1px solid var(--line)}
  .next div{flex:1;font-size:.66rem;color:var(--soft)}
  .next b{display:block;margin-top:.1rem;color:var(--ink);font-size:.82rem;font-weight:400}

  footer{text-align:center;color:var(--soft);font-size:.7rem;opacity:.8}

  /* Popup jam pulang: biru navy mewah */
  .pop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(70% 60% at 50% 45%,rgba(40,100,220,.28),rgba(2,6,16,.86));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pop.show{display:flex;animation:fade .5s ease both}
  .pop-card{position:relative;width:min(540px,100%);text-align:center;padding:2.4rem 2rem 2rem;border-radius:22px;
    background:linear-gradient(165deg,#10264f 0%,#0a1633 55%,#07102a 100%);
    border:1px solid rgba(120,175,255,.38);
    box-shadow:0 0 0 6px rgba(90,160,255,.07),0 30px 90px rgba(20,70,200,.45),inset 0 1px 0 rgba(180,215,255,.25);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .pop-card::before{content:"";position:absolute;inset:8px;border-radius:15px;border:1px solid rgba(120,175,255,.16);pointer-events:none}
  .pop-ring{width:4.2rem;height:4.2rem;margin:0 auto 1.1rem;border-radius:50%;display:grid;place-items:center;
    border:1px solid rgba(140,190,255,.55);background:radial-gradient(circle,rgba(70,140,255,.35),rgba(70,140,255,.05) 70%);
    box-shadow:0 0 36px rgba(70,140,255,.5)}
  .pop-ring svg{width:2rem;height:2rem;fill:none;stroke:#bcd9ff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .pop h2{font-size:2.1rem;font-weight:600;letter-spacing:.04em;color:#eaf3ff}
  .pop-time{margin:.4rem 0 .9rem;font-size:4.6rem;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#ffffff 10%,#8fc2ff 60%,#4a8ff0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(80,150,255,.55))}
  .pop p{color:#a9c3ea;font-size:1rem;line-height:1.6;max-width:30ch;margin:0 auto 1.5rem}
  .pop button{font:inherit;font-weight:600;font-size:.95rem;letter-spacing:.06em;color:#fff;cursor:pointer;padding:.75rem 2.6rem;border-radius:99px;
    border:1px solid rgba(160,205,255,.55);background:linear-gradient(180deg,#3f86f0,#2358c9);box-shadow:0 8px 26px rgba(40,100,230,.5)}
  .pop button:hover{filter:brightness(1.12)}
  .pop button:focus-visible{outline:2px solid #cfe3ff;outline-offset:3px}
  @keyframes fade{from{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
  /* Quote berjalan */
  .quote{overflow:hidden;padding:.5rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .qtrack{display:inline-block;white-space:nowrap;padding-left:100%;font-weight:300;font-size:1.2rem;letter-spacing:.03em;color:var(--date);text-shadow:0 2px 14px rgba(0,0,0,.7);will-change:transform}
  @keyframes qscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
  h1,.clock,.clock span,.qtrack,.date,.cursor,.panel header,.panel header i,.w-temp,.lbl,.hint{transition:color 1.6s ease,background-color 1.6s ease,text-shadow 1.6s ease}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.qtrack{display:block;padding-left:0;white-space:normal;text-align:center}}
</style>
</head>
<body>

<main>

<script>
/* ===== PENGATURAN ===== */
const START = 8, END = 17;               // jam masuk & pulang
const WARN_SECONDS = 120;                // warna berubah 2 menit sebelum pulang
const ADM4 = "32.76.01.1008";            // Kelurahan Pancoran Mas, Kota Depok (kode wilayah BMKG)

const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const p2 = n => String(n).padStart(2,"0");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Uji coba: tambahkan ?jam=16:57:30 di URL untuk mensimulasikan waktu */
let OFFSET = 0;
const q = new URLSearchParams(location.search).get("jam");
if (q && /^\d{1,2}:\d{2}(:\d{2})?$/.test(q)) {
  const [h,m,s] = q.split(":").map(Number); const t = new Date(); t.setHours(h,m,s||0,0); OFFSET = t - new Date();
}
const getNow = () => new Date(Date.now() + OFFSET);

/* Latar belakang: 48 wallpaper gratis beresolusi tinggi dari Pexels, berganti tiap 30 menit.
   2 tema bergantian: alam (24 gambar) dan teknologi (24 gambar). Angka = ID foto Pexels.
   Gambar dimuat 1920 piksel agar tajam. Jika sebuah gambar gagal dimuat, dicoba gambar berikutnya
   di tema yang sama, lalu gambar cadangan Picsum. */
const THEME_IMAGES = [
  // 0: alam
  [27561824,2080960,1323550,27222020,20572569,592077,3863216,9687907,
   29569056,31132146,9744509,2088167,28893475,34551555,27954298,371589,
   371629,10229606,14212003,17559575,17038850,17038848,36388602,17038851],
  // 1: teknologi
  [28494632,12489187,30547577,29506609,40292559,39449112,2182863,33798621,
   7562087,3612932,29738253,2387532,40449920,2115256,30353201,30353205,
   13988975,17323801,17489150,17489163,5480781,6466141,5408005,5203849]

const imgUrl = v => "https://images.pexels.com/photos/" + v + "/pexels-photo-" + v + ".jpeg?auto=compress&cs=tinysrgb&w=1920";
function slotUrls(slot){            // slot 0..47; alam dan teknologi bergantian tiap slot
  const t = THEME_IMAGES[slot % 2], i = Math.floor(slot / 2) % t.length;
  return [imgUrl(t[i]), imgUrl(t[(i + 1) % t.length]), "https://picsum.photos/seed/rsby-" + slot + "/1920/1080"];
}
/* Warna teks mengikuti tema gambar: alam (hijau sage) dan teknologi (biru es platinum) */
const PALETTES = [
  {ac:"#b9e6c6", ac2:"#86bc9b", clock:"#f4fbf5", date:"#d8eadc", ink:"#ecf6ee", soft:"#abc3b1", line:"rgba(185,230,198,.26)", glow:"rgba(120,205,150,.32)", tint:"rgba(110,200,140,.10)"},
  {ac:"#9adbe9", ac2:"#6db4c6", clock:"#f1fafd", date:"#d3e7ee", ink:"#eaf6fa", soft:"#a5bfc9", line:"rgba(154,219,233,.26)", glow:"rgba(90,200,230,.34)", tint:"rgba(80,190,225,.10)"}

function applyPalette(i){
  const p = PALETTES[i], r = document.documentElement.style;
  Object.keys(p).forEach(k => r.setProperty("--" + k, p[k]));
}
/* Quote penyemangat kerja: acak, berganti tiap 30 menit (bersamaan dengan gambar latar), teks berjalan pelan */
const QUOTES = [
  "Aku rela menjadi backup data otomatis di servermu. Meskipun dilupakan saat semuanya lancar, aku adalah satu-satunya yang kamu cari saat duniamu mendadak crash dan hancur.",
  "Hubungan kita itu ibarat jaringan LAN rumah sakit. Ribet, banyak cabang, rawan kegulung, tapi kalau putus satu, seluruh sistem langsung lumpuh total.",
  "Cintaku padamu itu seperti Windows Update di komputer IGD. Selalu datang di waktu yang tidak tepat, bikin pusing, tapi sebenarnya demi kebaikan masa depan kita.",

  "Setiap kali user bilang 'Saya tidak ngapa-ngapain kok tiba-tiba rusak', di situlah malaikat pencatat amal langsung tersenyum sambil menyiapkan lembar catatan baru.",
  "Puncak kejayaan seorang IT Support adalah ketika berhasil memperbaiki jaringan internet yang lemot hanya dengan modal mencabut kabel adaptor selama 10 detik lalu mencoloknya kembali.",
  "Kami mungkin jarang terlihat tersenyum di koridor rumah sakit. Bukan karena kami sombong, tapi karena otak kami sedang sibuk melakukan pinging ke server utama untuk memastikan semuanya aman terkendali.",
  "Jangan lupa ngopi MAS PANDI jangan kerja mulu, pikirin lah ini kita"
];
const QUOTE_SPEED = 60;   // piksel per detik (makin kecil makin lambat)
let lastQuote = -1;
const calmMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function quoteDuration(){
  const el = $("qtext"); if (calmMotion) return;
  el.style.animationDuration = (el.offsetWidth / QUOTE_SPEED).toFixed(1) + "s";
}
function setQuote(){
  let i; do { i = Math.floor(Math.random() * QUOTES.length); } while (i === lastQuote && QUOTES.length > 1);
  lastQuote = i;
  const el = $("qtext");
  el.textContent = "\u201C" + QUOTES[i] + "\u201D";
  if (calmMotion) return;
  el.style.animation = "none"; void el.offsetWidth;
  el.style.animation = "qscroll 60s linear infinite";
  quoteDuration();
}
window.addEventListener("resize", quoteDuration);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(quoteDuration);
const slotOf = d => d.getHours() * 2 + (d.getMinutes() >= 30 ? 1 : 0);
let bgSlot = -1;
function loadFirst(urls, done){
  (function tryNext(n){
    if (n >= urls.length) return done(null);
    const img = new Image();
    img.onload = () => done(urls[n]);
    img.onerror = () => tryNext(n + 1);
    img.src = urls[n];
  })(0);
}
function applyBg(d){
  const slot = slotOf(d);
  if (slot === bgSlot) return; bgSlot = slot;
  applyPalette(slot % 2);
  setQuote();
  loadFirst(slotUrls(slot), url => {
    if (!url || slot !== bgSlot) return;           // semua gagal: tetap latar gelap polos
    const holder = $("bg"), old = Array.from(holder.querySelectorAll(".bglayer"));
    const layer = document.createElement("div");
    layer.className = "bglayer";
    layer.style.backgroundImage = "url('" + url + "')";
    holder.appendChild(layer);
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add("on")));
    setTimeout(() => old.forEach(el => el.remove()), 1900);
    loadFirst(slotUrls((slot + 1) % 48), () => {}); // siapkan gambar berikutnya lebih awal
  });
}

function salam(h){
  if (h >= 4 && h < 11) return "pagi";
  if (h >= 11 && h < 15) return "siang";
  if (h >= 15 && h < 18) return "sore";
  return "malam";
}
function at(base, h, addDays){ const d = new Date(base); d.setDate(d.getDate()+addDays); d.setHours(h,0,0,0); return d; }
function nextWorkStart(now){ let add = 1; while ([0,6].includes(at(now,0,add).getDay())) add++; return at(now, START, add); }
function fmt(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60), s = t%60;
  return (d ? d + " hari " : "") + p2(h) + ":" + p2(m) + ":" + p2(s);
}


/* ===== Popup jam pulang ===== */
let popTimer = null;
const popShown = { masuk: "", pulang: "" };
const POPUPS = {
  masuk:  { title:"Selamat Bekerja", hour:START, btn:"Siap, Semangat!",
            msg:"Selamat datang, IT RSBY! Semangat memulai hari, karena kerjamu menjaga layanan rumah sakit tetap berjalan lancar.",
            icon:"M3 19h18M6.5 19a5.5 5.5 0 0 1 11 0M12 5v3M5.2 10.2l1.8 1.8M18.8 10.2 17 12M2.5 15h2M19.5 15h2" },
  pulang: { title:"Waktunya Pulang", hour:END, btn:"Tutup",
            msg:"Terima kasih atas kerja keras hari ini, IT RSBY. Simpan pekerjaan Anda dan hati-hati di jalan.",
            icon:"M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5" }
};
function chime(){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [659.25, 880, 1318.5].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*.28;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t+.03); g.gain.exponentialRampToValueAtTime(.0001, t+1.2);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.3);
    });
  }catch(e){}
}
function showPop(kind){
  const c = POPUPS[kind];
  $("popT").textContent = c.title;
  $("popTime").textContent = p2(c.hour) + ":00";
  $("popMsg").textContent = c.msg;
  $("popIcon").setAttribute("d", c.icon);
  $("popClose").textContent = c.btn;
  $("pop").classList.add("show");
  $("popClose").focus({preventScroll:true});
  chime();
  clearTimeout(popTimer); popTimer = setTimeout(closePop, 120*1000);
}
function closePop(){ $("pop").classList.remove("show"); }
$("popClose").addEventListener("click", closePop);
$("pop").addEventListener("click", e => { if (e.target.id === "pop") closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

function tick(){
  const now = getNow();
  applyBg(now);
  const s = salam(now.getHours());
  $("greetText").textContent = "SELAMAT " + s.toUpperCase() + " IT RSBY";
  $("hh").textContent = p2(now.getHours());
  $("mm").textContent = p2(now.getMinutes());
  $("ss").textContent = p2(now.getSeconds());
  $("date").textContent = HARI[now.getDay()] + ", " + now.getDate() + " " + BULAN[now.getMonth()] + " " + now.getFullYear();

  const weekend = [0,6].includes(now.getDay());
  const start = at(now, START, 0), end = at(now, END, 0);
  const dayKey = now.toDateString();
  if (!weekend && now >= start && now - start < 30*60*1000 && popShown.masuk !== dayKey){ popShown.masuk = dayKey; showPop("masuk"); }
  if (!weekend && now >= end && now - end < 30*60*1000 && popShown.pulang !== dayKey){ popShown.pulang = dayKey; showPop("pulang"); }
  let label, target, pct, hint, warn = false;

  if (!weekend && now >= start && now < end){
    target = end; pct = (now - start) / (end - start) * 100;
    if (end - now <= WARN_SECONDS * 1000){
      warn = true; label = "Hampir jam pulang!";
      hint = "Sebentar lagi pulang, saatnya merapikan pekerjaan";
    } else {
      label = "Jam pulang kerja dalam";
      hint = Math.round(pct) + "% hari kerja sudah berjalan (08:00 – 17:00)";
    }
  } else if (!weekend && now < start){
    label = "Jam masuk kerja dalam"; target = start; pct = 0; hint = "Masuk pukul 08:00";
  } else {
    label = weekend ? "Libur akhir pekan. Masuk kerja lagi dalam" : "Jam kerja selesai. Masuk kerja lagi dalam";
    target = nextWorkStart(now); pct = weekend ? 0 : 100;
    hint = "Masuk berikutnya " + HARI[target.getDay()] + " pukul 08:00";
  }
  $("cdCard").classList.toggle("warn", warn);
  $("state").textContent = warn ? "pulang!" : (target === end ? "running" : "standby");
  $("cdLabel").textContent = label;
  $("cd").textContent = fmt(target - now);
  $("bar").style.width = pct + "%";
  $("cdHint").textContent = hint;
}
tick(); setInterval(tick, 1000);

/* ===== Cuaca dari BMKG ===== */
function ikon(desc, hour){
  const d = desc.toLowerCase();
  if (d.includes("petir")) return "⛈️";
  if (d.includes("ringan") && d.includes("hujan")) return "🌦️";
  if (d.includes("hujan")) return "🌧️";
  if (d.includes("kabut") || d.includes("kabur") || d.includes("asap")) return "🌫️";
  if (d.includes("cerah berawan")) return hour >= 18 || hour < 6 ? "☁️" : "🌤️";
  if (d.includes("berawan")) return "☁️";
  if (d.includes("cerah")) return hour >= 18 || hour < 6 ? "🌙" : "☀️";
  return "🌡️";
}

async function fetchBMKG(){
  const urls = ["/api/cuaca?adm4=" + ADM4, "https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=" + ADM4];
  for (const u of urls){
    try { const r = await fetch(u); if (r.ok) return await r.json(); } catch(e){}
  }
  throw new Error("BMKG tidak dapat diakses");
}

async function loadWeather(){
  try{
    const j = await fetchBMKG();
    const lok = j.lokasi || (j.data && j.data[0] && j.data[0].lokasi) || {};
    const list = ((j.data && j.data[0] && j.data[0].cuaca) || []).flat().map(e => ({
      ...e, time: new Date(String(e.utc_datetime).replace(" ","T") + "Z")
    })).sort((a,b) => a.time - b.time);
    if (!list.length) throw new Error("kosong");

    const nowMs = Date.now();
    let ci = 0, best = Infinity;
    list.forEach((e,i) => { const d = Math.abs(e.time - nowMs); if (d < best){ best = d; ci = i; } });
    const c = list[ci];
    const today = new Date().toDateString();
    const todayList = list.filter(e => e.time.toDateString() === today);
    const temps = (todayList.length ? todayList : [c]).map(e => Number(e.t));
    const rain = todayList.some(e => String(e.weather_desc).toLowerCase().includes("hujan"));
    const next = list.slice(ci + 1, ci + 4);

    $("loc").textContent = lok.desa ? [lok.desa, lok.kotkab].filter(Boolean).join(", ") : "bmkg";
    $("weather").innerHTML =
      '<div class="w-main"><div class="w-ico">' + ikon(c.weather_desc, c.time.getHours()) + '</div><div><div class="w-temp">' + Math.round(c.t) +
      '°C</div><div class="w-desc">' + esc(c.weather_desc) + '</div></div></div>' +
      '<div class="w-list">' +
      '<div>Kelembapan<b>' + esc(c.hu) + '%</b></div>' +
      '<div>Suhu hari ini<b>' + Math.min(...temps) + '° – ' + Math.max(...temps) + '°C</b></div>' +
      '<div>Angin<b>' + Math.round(c.ws) + ' km/j</b></div>' +
      '<div>Potensi hujan<b>' + (rain ? "Ada hari ini" : "Tidak ada") + '</b></div>' +
      '</div>' +
      (next.length ? '<div class="next">' + next.map(e =>
        '<div>' + p2(e.time.getHours()) + ':00<b>' + ikon(e.weather_desc, e.time.getHours()) + ' ' + Math.round(e.t) + '°</b></div>').join("") + '</div>' : "");
  }catch(e){
    $("weather").innerHTML = '<p class="hint">Data BMKG belum dapat dimuat. Muat ulang halaman, atau periksa kode wilayah (ADM4) di index.html.</p>';
  }
}
loadWeather(); setInterval(loadWeather, 30*60*1000);
